site_name: 速搭文档
site_url: https://tuoda2026.github.io/suda-docs
site_author: 速搭团队
site_description: 速搭（Suda）使用文档 - 面向 iOS 开发的桌面级可视化界面搭建工具

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables

docs_dir: docs

nav:
  - 首页: index.md
  - 使用指南: USAGE.md
  - 隐私政策: privacy.md
  - 服务条款: terms.md
